<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Bersama Kami</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0e0e0e; color: #fff; line-height: 1.7; overflow-x: hidden; }

        /* Landing Page dengan Background Gambar Responsif */
        .landing {
            width:100%; 
            height:100vh;
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            justify-content:center;
            text-align:center;
            animation: fadeIn 2s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* Background untuk desktop (orientasi landscape) */
        .landing::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(14, 14, 14, 0.7), rgba(14, 14, 14, 0.5)),
                url('image/bgweb.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        
        /* Override untuk mobile portrait (orientasi portrait) */
        @media screen and (orientation: portrait) {
            .landing::before {
                background: 
                    linear-gradient(rgba(14, 14, 14, 0.7), rgba(14, 14, 14, 0.5)),
                    url('image/bgweb.jpeg');
                background-size: cover;
                background-position: center;
                /* Untuk orientasi portrait, kita bisa crop bagian tengah */
                background-position: center 30%;
            }
        }
        
        /* Jika ingin gambar yang berbeda untuk mobile portrait */
        /* @media screen and (orientation: portrait) and (max-width: 768px) {
            .landing::before {
                background: 
                    linear-gradient(rgba(14, 14, 14, 0.7), rgba(14, 14, 14, 0.5)),
                    url('image/bgweb-portrait.jpeg');  gambar versi portrait
                background-size: cover;
                background-position: center;
            }
        } */
        
        .landing h1 { 
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight:700; 
            color:#fff; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            padding: 0 20px;
        }
        
        .landing p { 
            margin-top:10px; 
            font-size: clamp(1rem, 3vw, 1.3rem);
            color:#f0f0f0; 
            opacity:0.9;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
            padding: 0 20px;
            max-width: 600px;
        }
        
        .landing button {
            margin-top:30px; 
            padding: clamp(10px, 3vw, 12px) clamp(20px, 4vw, 25px); 
            border:none; 
            border-radius:8px;
            background:#0e0e0e; 
            color:#00ff88; 
            font-weight:700; 
            cursor:pointer;
            transition:0.3s; 
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            min-width: 150px;
        }
        
        .landing button:hover { 
            background:#1c1c1c; 
            transform:scale(1.08); 
        }
        
        @keyframes fadeIn { 
            from { opacity:0; } 
            to { opacity:1; } 
        }
        
        /* Untuk layar yang sangat lebar (desktop landscape) */
        @media screen and (min-width: 1200px) and (orientation: landscape) {
            .landing::before {
                background-size: 100% auto;
                background-position: center top;
            }
        }
        
        /* Untuk mobile landscape */
        @media screen and (max-width: 900px) and (orientation: landscape) {
            .landing {
                padding: 40px 20px;
            }
            
            .landing h1 {
                font-size: 2rem;
            }
            
            .landing p {
                font-size: 1rem;
            }
            
            .landing::before {
                background-position: center 20%;
            }
        }
        
        /* Untuk mobile portrait kecil */
        @media screen and (max-width: 480px) and (orientation: portrait) {
            .landing h1 {
                font-size: 1.8rem;
            }
            
            .landing p {
                font-size: 1rem;
            }
            
            .landing button {
                padding: 10px 20px;
            }
            
            .landing::before {
                background-position: center 25%;
            }
        }
    </style>
</head>
<body>

    <!-- Landing Page -->
    <div class="landing" id="landing">
        <h1>Selamat Datang</h1>
        <p>Jelajahi perjalanan dan momen terbaik kami.</p>
        <button onclick="enterSite()">Masuk</button>
    </div>

    <!-- Script untuk handle responsif dan orientasi -->
    <script>
        function enterSite() {
            window.location.href = "wisudah.html";
        }
        
        // Deteksi orientasi dan sesuaikan background
        function adjustBackgroundForOrientation() {
            const landing = document.querySelector('.landing');
            const isPortrait = window.matchMedia("(orientation: portrait)").matches;
            const isMobile = window.innerWidth <= 768;
            
            if (isPortrait) {
                // Untuk portrait (mobile), sesuaikan background position
                document.documentElement.style.setProperty('--bg-position', 'center 30%');
                
                // Jika ingin gambar yang berbeda untuk portrait
                // if (isMobile) {
                //     document.querySelector('.landing').style.backgroundImage = 
                //         "linear-gradient(rgba(14, 14, 14, 0.7), rgba(14, 14, 14, 0.5)), url('image/bgweb-portrait.jpeg')";
                // }
            } else {
                // Untuk landscape (desktop), gunakan cover normal
                document.documentElement.style.setProperty('--bg-position', 'center');
            }
        }
        
        // Panggil saat load dan resize
        window.addEventListener('load', adjustBackgroundForOrientation);
        window.addEventListener('resize', adjustBackgroundForOrientation);
        window.addEventListener('orientationchange', function() {
            // Beri sedikit delay untuk orientasi berubah
            setTimeout(adjustBackgroundForOrientation, 100);
        });
        
        // Deteksi jika gambar gagal dimuat
        const bgImage = new Image();
        bgImage.src = 'image/bgweb.jpeg';
        
        bgImage.onerror = function() {
            console.warn('Gambar background tidak ditemukan di image/bgweb.jpeg');
            // Fallback ke warna solid jika gambar tidak ditemukan
            document.querySelector('.landing').style.background = 
                'linear-gradient(135deg, #00ff88 0%, #00995e 50%, #0e0e0e 100%)';
        };
    </script>

</body>
</html>
