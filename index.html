<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Bersama Kami - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0e0e0e; color: #fff; line-height: 1.7; overflow-x: hidden; }

        /* Login Container */
        .login-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Background gambar dari folder image/bgweb.jpeg */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(14, 14, 14, 0.8), rgba(14, 14, 14, 0.8)),
                url('image/bgweb.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        .login-box {
            background: rgba(28, 28, 28, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.2);
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        .login-box h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 255, 136, 0.5);
        }

        .login-box p {
            font-size: 0.95rem;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: #00ff88;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            background: rgba(0, 0, 0, 0.7);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ff4444;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: rgba(255, 68, 68, 0.1);
            border-left: 3px solid #ff4444;
            border-radius: 4px;
        }

        .success-message {
            color: #00ff88;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-toggle {
            cursor: pointer;
            user-select: none;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
        }

        .input-wrapper span {
            position: absolute;
            right: 15px;
            color: #00ff88;
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none;
        }

        /* ============ BIRTHDAY MODAL ============ */
        .birthday-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.5s ease;
        }

        .birthday-modal.show {
            display: flex;
        }

        .birthday-content {
            position: relative;
            text-align: center;
            animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .birthday-cake {
            font-size: 120px;
            margin-bottom: 20px;
            animation: cakeBounce 1s infinite ease-in-out;
        }

        @keyframes cakeBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .birthday-text h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff, #ff6b9d);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .birthday-text p {
            font-size: 1.8rem;
            color: #fff;
            margin: 15px 0;
            font-weight: 600;
        }

        .birthday-date {
            font-size: 1.2rem;
            color: #ffd93d;
            margin: 10px 0;
            font-weight: 500;
        }

        .birthday-message {
            font-size: 1rem;
            color: #b0f0f0;
            margin-top: 20px;
            max-width: 400px;
            line-height: 1.8;
            font-style: italic;
        }

        .birthday-close {
            margin-top: 30px;
        }

        .birthday-close-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff6b9d);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .birthday-close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        /* Candles */
        .birthday-candles {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .candle {
            position: relative;
            width: 40px;
            height: 80px;
            animation: candleWave 2s ease-in-out infinite;
        }

        @keyframes candleWave {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        .candle-stick {
            width: 6px;
            height: 50px;
            background: #f5deb3;
            margin: 0 auto;
            border-radius: 3px;
        }

        .candle-flame {
            width: 16px;
            height: 28px;
            background: linear-gradient(to top, #ff8800, #ffff00);
            border-radius: 50% 50% 50% 0;
            margin: 0 auto;
            animation: flameFlicker 0.6s infinite ease-in-out;
        }

        @keyframes flameFlicker {
            0%, 100% { transform: scaleY(1) scaleX(1); opacity: 1; }
            50% { transform: scaleY(1.1) scaleX(0.9); opacity: 0.8; }
        }

        /* Confetti */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .birthday-text h1 {
                font-size: 2.5rem;
            }

            .birthday-text p {
                font-size: 1.4rem;
            }

            .birthday-cake {
                font-size: 80px;
            }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Login</h1>
            <p>Masukkan password untuk melanjutkan</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Masukkan password..." 
                            required
                            autocomplete="off"
                        >
                        <span id="togglePassword" class="password-toggle" onclick="togglePasswordVisibility()">👁️</span>
                    </div>
                </div>

                <button type="submit" class="login-btn">Masuk</button>
            </form>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <!-- Birthday Modal -->
    <div class="birthday-modal" id="birthdayModal">
        <div class="birthday-content">
            <div class="birthday-cake">🎂</div>
            
            <div class="birthday-text">
                <h1 id="birthdayName">SELAMAT ULANG TAHUN!</h1>
                <p id="birthdayMessage"></p>
                <div class="birthday-date" id="birthdayDate"></div>
            </div>

            <div class="birthday-candles" id="birthdayCandles"></div>

            <div class="birthday-message">
                <p>Semoga hari spesialmu dipenuhi dengan kebahagiaan, tawa, dan momen indah bersama orang-orang terkasih! 🎉✨</p>
            </div>

            <div class="birthday-close">
                <button class="birthday-close-btn" onclick="closeBirthdayModal()">Tutup 💚</button>
            </div>
        </div>
    </div>

    <!-- Script Login & Birthday -->
    <script>
        // ============ PASSWORD AUTHENTICATION ============
        const validPasswords = ["bung clone", "fisah", "arif"];

        // Birthday data dengan detail
        const birthdayData = [
            {
                date: "04-29", // MM-DD format
                name: "Nurwafisah",
                displayName: "Fisah",
                emoji: "🌸"
            },
            {
                date: "10-25", // MM-DD format
                name: "Muh Arifatwa",
                displayName: "Bung Clone",
                emoji: "🎮"
            }
        ];

        function handleLogin(event) {
            event.preventDefault();
            
            const passwordInput = document.getElementById('password').value.toLowerCase();
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Sembunyikan pesan sebelumnya
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Cek apakah password valid
            if (validPasswords.includes(passwordInput)) {
                // Password benar
                successMessage.textContent = '✓ Password benar! Mengalihkan...';
                successMessage.style.display = 'block';
                
                // Simpan status login di sessionStorage
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect ke halaman utama setelah 1 detik
                setTimeout(() => {
                    window.location.href = 'wisudah.html';
                }, 1000);
            } else {
                // Password salah
                errorMessage.textContent = '✗ Password salah! Silahkan coba lagi.';
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        // ============ BIRTHDAY DETECTION & DISPLAY ============
        function getTodayDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${month}-${day}`;
        }

        function checkBirthday() {
            const today = getTodayDate();
            const birthday = birthdayData.find(b => b.date === today);
            
            if (birthday) {
                // Tampilkan modal ulang tahun
                showBirthdayModal(birthday);
                // Buat confetti
                createConfetti();
                // Mainkan suara (opsional, jika ada)
                playBirthdaySound();
            }
        }

        function showBirthdayModal(birthday) {
            const modal = document.getElementById('birthdayModal');
            document.getElementById('birthdayName').textContent = `SELAMAT ULANG TAHUN ${birthday.displayName.toUpperCase()}! ${birthday.emoji}`;
            document.getElementById('birthdayMessage').textContent = `${birthday.name}`;
            document.getElementById('birthdayDate').textContent = `🎂 Ulang Tahun Ke-? Tahun Ini`;
            
            // Generate candles
            generateCandles();
            
            // Tampilkan modal
            modal.classList.add('show');
        }

        function generateCandles() {
            const candlesContainer = document.getElementById('birthdayCandles');
            candlesContainer.innerHTML = '';
            
            // Generate 5 lilin dekoratif
            for (let i = 0; i < 5; i++) {
                const candle = document.createElement('div');
                candle.className = 'candle';
                candle.style.animationDelay = `${i * 0.1}s`;
                candle.innerHTML = `
                    <div class="candle-flame" style="animation-delay: ${i * 0.1}s"></div>
                    <div class="candle-stick"></div>
                `;
                candlesContainer.appendChild(candle);
            }
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff', '#ff6b9d', '#00ff88'];
            const confettiCount = 50;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.textContent = ['🎉', '🎊', '🎈', '🎁', '✨', '💚'][Math.floor(Math.random() * 6)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.fontSize = Math.random() * 20 + 20 + 'px';
                confetti.style.animationDuration = Math.random() * 2 + 2.5 + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.opacity = Math.random() * 0.7 + 0.3;
                
                document.body.appendChild(confetti);

                // Hapus elemen setelah animasi selesai
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function playBirthdaySound() {
            // Buat simple beep sound menggunakan Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Audio tidak dapat diputar');
            }
        }

        function closeBirthdayModal() {
            document.getElementById('birthdayModal').classList.remove('show');
        }

        // ============ INITIALIZATION ============
        window.addEventListener('load', () => {
            // Cek apakah sudah login
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'wisudah.html';
            }

            // Cek ulang tahun
            checkBirthday();
        });

        // Clear password saat halaman ditutup atau user logout
        window.addEventListener('beforeunload', () => {
            if (document.hidden) {
                sessionStorage.removeItem('isLoggedIn');
            }
        });

        // Allow Enter key untuk submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // Focus pada input saat halaman dimuat
        document.getElementById('password').focus();
    </script>

</body>
</html>
