<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Bersama Kami - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0e0e0e; color: #fff; line-height: 1.7; overflow-x: hidden; }

        /* Login Container */
        .login-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 2s ease;
            position: relative;
            overflow: hidden;
        }

        /* Background gambar dari folder image/bgweb.jpeg */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(14, 14, 14, 0.8), rgba(14, 14, 14, 0.8)),
                url('image/bgweb.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        .login-box {
            background: rgba(28, 28, 28, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.2);
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.5s ease;
        }

        .login-box h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 255, 136, 0.5);
        }

        .login-box p {
            font-size: 0.95rem;
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: #00ff88;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            background: rgba(0, 0, 0, 0.7);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ff4444;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: rgba(255, 68, 68, 0.1);
            border-left: 3px solid #ff4444;
            border-radius: 4px;
        }

        .success-message {
            color: #00ff88;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-toggle {
            cursor: pointer;
            user-select: none;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
        }

        .input-wrapper span {
            position: absolute;
            right: 15px;
            color: #00ff88;
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Login</h1>
            <p>Masukkan password untuk melanjutkan</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Masukkan password..." 
                            required
                            autocomplete="off"
                        >
                        <span id="togglePassword" class="password-toggle" onclick="togglePasswordVisibility()">👁️</span>
                    </div>
                </div>

                <button type="submit" class="login-btn">Masuk</button>
            </form>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <!-- Script Login -->
    <script>
        // Password yang valid
        const validPasswords = ["bung clone", "fisah", "arif"];

        function handleLogin(event) {
            event.preventDefault();
            
            const passwordInput = document.getElementById('password').value.toLowerCase();
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Sembunyikan pesan sebelumnya
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Cek apakah password valid
            if (validPasswords.includes(passwordInput)) {
                // Password benar
                successMessage.textContent = '✓ Password benar! Mengalihkan...';
                successMessage.style.display = 'block';
                
                // Simpan status login di sessionStorage
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect ke halaman utama setelah 1 detik
                setTimeout(() => {
                    window.location.href = 'wisudah.html';
                }, 1000);
            } else {
                // Password salah
                errorMessage.textContent = '✗ Password salah! Silahkan coba lagi.';
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        // Cek apakah sudah login saat halaman dimuat
        window.addEventListener('load', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'wisudah.html';
            }
        });

        // Clear password saat halaman ditutup atau user logout
        window.addEventListener('beforeunload', () => {
            // Logout saat menutup tab
            if (document.hidden) {
                sessionStorage.removeItem('isLoggedIn');
            }
        });

        // Allow Enter key untuk submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // Focus pada input saat halaman dimuat
        document.getElementById('password').focus();
    </script>

</body>
</html>
