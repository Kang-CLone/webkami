<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Bersama Kami</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0e0e0e; color: #fff; line-height: 1.7; overflow-x: hidden; }

        /* Landing Page dengan Background Gambar dari folder image/ */
        .landing {
            width:100%; 
            height:100vh;
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            justify-content:center;
            text-align:center;
            animation: fadeIn 2s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* Background gambar dari folder image/bgweb.jpeg */
        .landing::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(14, 14, 14, 0.7), rgba(14, 14, 14, 0.5)),
                url('image/bgweb.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        
        .landing h1 { 
            font-size:3.2rem; 
            font-weight:700; 
            color:#fff; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .landing p { 
            margin-top:10px; 
            font-size:1.3rem; 
            color:#f0f0f0; 
            opacity:0.9;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }
        
        .landing button {
            margin-top:30px; 
            padding:12px 25px; 
            border:none; 
            border-radius:8px;
            background:#0e0e0e; 
            color:#00ff88; 
            font-weight:700; 
            cursor:pointer;
            transition:0.3s; 
            font-size:1rem;
        }
        
        .landing button:hover { 
            background:#1c1c1c; 
            transform:scale(1.08); 
        }
        
        @keyframes fadeIn { 
            from { opacity:0; } 
            to { opacity:1; } 
        }
    </style>
</head>
<body>

    <!-- Landing Page -->
    <div class="landing" id="landing">
        <h1>Selamat Datang</h1>
        <p>Jelajahi perjalanan dan momen terbaik kami.</p>
        <button onclick="enterSite()">Masuk</button>
    </div>

    <!-- Script Redirect -->
    <script>
        function enterSite() {
            window.location.href = "wisudah.html";
        }
    </script>

</body>
</html>
